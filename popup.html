<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 230px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #0f0f0f;
      background: #fff;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    header svg {
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .label {
      line-height: 1.3;
      color: #333;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    input:checked + .slider {
      background: #ff0000;
    }

    input:checked + .slider::before {
      transform: translateX(18px);
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 12px 0;
    }

    .speed-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .speed-buttons {
      display: flex;
      gap: 6px;
    }

    .speed-btn {
      flex: 1;
      padding: 5px 0;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .speed-btn:hover {
      border-color: #bbb;
      background: #f5f5f5;
    }

    .speed-btn.active {
      border-color: #ff0000;
      background: #ff0000;
      color: #fff;
    }

    footer {
      margin-top: 14px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="6" fill="#ff0000"/>
      <path d="M13.5 3L5 13.5h6.5L10 21l9-10.5h-6.5L13.5 3z" fill="#fff"/>
    </svg>
    <h1>Shorts Auto-Scroll</h1>
  </header>

  <div class="row">
    <span class="label">Авто-прокрутка шортсов</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="divider"></div>

  <div class="speed-label">Скорость воспроизведения</div>
  <div class="speed-buttons">
    <button class="speed-btn" data-speed="0.5">×0.5</button>
    <button class="speed-btn active" data-speed="1">×1</button>
    <button class="speed-btn" data-speed="1.5">×1.5</button>
    <button class="speed-btn" data-speed="2">×2</button>
  </div>

  <footer>Включите на youtube.com/shorts</footer>

  <script src="popup.js"></script>
</body>
</html>
